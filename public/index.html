<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTA 3D Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --text-color: #000000;
            --secondary-text: #8e8e93;
            --accent-color: #007aff;
            --border-color: #e5e5ea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f0f10;
                --card-bg: #1c1c1e;
                --text-color: #ffffff;
                --secondary-text: #8e8e93;
                --accent-color: #007aff;
                --border-color: #2c2c2e;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 70px;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .hero-banner {
            background: linear-gradient(135deg, #007aff, #5856d6);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }
        .cat-btn {
            padding: 8px 16px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .cat-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background: #2c2c2e;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-price {
            font-size: 14px;
            color: #34c759;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
        }
        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--secondary-text);
            font-size: 12px;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ВКЛАДКА: КАТАЛОГ -->
    <div id="tab-catalog">
        <div class="header">
            <h2 style="margin:0;">USTA 3D Store</h2>
        </div>

        <div class="hero-banner">
            <h3 style="margin:0 0 6px 0;">Ваши идеи в реальность!</h3>
            <p style="margin:0; font-size: 13px; opacity: 0.9;">Создаем уникальные модели, декор и детали любой сложности.</p>
        </div>

        <input type="text" class="search-box" placeholder="Найти товары или модели..." id="search-input">

        <div class="categories">
            <button class="cat-btn active">Все товары</button>
            <button class="cat-btn">Для дома</button>
            <button class="cat-btn">Авто</button>
            <button class="cat-btn">Подарки</button>
        </div>

        <div class="grid">
            <div class="card">
                <div>
                    <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=300" alt="3D">
                    <div class="card-title">3D Печать по файлу</div>
                    <div class="card-price">от 50 000 сум</div>
                </div>
                <button class="btn" onclick="makeOrder('3D Печать по файлу', 50000)">Заказать</button>
            </div>

            <div class="card">
                <div>
                    <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?w=300" alt="Model">
                    <div class="card-title">Механические детали</div>
                    <div class="card-price">от 80 000 сум</div>
                </div>
                <button class="btn" onclick="makeOrder('Механические детали', 80000)">Заказать</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА: ЗАКАЗЫ -->
    <div id="tab-orders" style="display: none;">
        <h2 style="text-align:center;">📋 Мои заказы</h2>
        <div id="orders-list"></div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('catalog', this)">
            <div>🏠</div>Каталог
        </button>
        <button class="nav-item" onclick="switchTab('orders', this)">
            <div>📦</div>Заказы
        </button>
    </div>

    <script src="orderManager.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function switchTab(tab, el) {
            document.getElementById('tab-catalog').style.display = tab === 'catalog' ? 'block' : 'none';
            document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
            
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            if (tab === 'orders') {
                renderOrdersList('orders-list');
                checkOrdersStatus();
            }
        }

        async function makeOrder(itemName, price) {
            const contact = prompt("Введите ваш номер телефона или Telegram:", "+998");
            if (!contact) return;

            const orderId = Date.now().toString().slice(-6);
            const orderData = {
                id: orderId,
                total: price,
                contact: contact,
                items: [itemName]
            };

            // Сохраняем в память телефона
            saveNewOrder(orderData);

            // Отправляем на сервер боту
            try {
                await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            } catch (e) {}

            alert('✅ Заказ №' + orderId + ' оформлен!');
            switchTab('orders', document.querySelectorAll('.nav-item')[1]);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderOrdersList('orders-list');
        });
    </script>
</body>
</html>
