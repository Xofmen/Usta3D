<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTA 3D Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f10;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        h1, h2 {
            text-align: center;
        }
        .card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .btn {
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:disabled {
            background-color: #555;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #ff9500; color: #fff; }
        .status-accepted { background: #34c759; color: #fff; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #2c2c2e;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #007aff;
        }
    </style>
</head>
<body>
    <h1>USTA 3D Store</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('catalog')">Каталог</button>
        <button class="tab-btn" onclick="showTab('orders')">Мои заказы</button>
    </div>

    <div id="tab-catalog">
        <div class="card">
            <h3>3D Печать на заказ</h3>
            <p>Загрузка и печать ваших 3D моделей высокой точности.</p>
            <label>Имя/Телефон:</label>
            <input type="text" id="cust-contact" placeholder="+998 90 123 45 67" style="width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
            <br><br>
            <label>Сумма заказа (сум):</label>
            <input type="number" id="order-price" value="50000" style="width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
            <button class="btn" onclick="submitOrder()">🚀 Оформить заказ</button>
        </div>
    </div>

    <div id="tab-orders" style="display: none;">
        <h2>История заказов</h2>
        <div id="orders-list"></div>
    </div>

    <script src="orderManager.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function showTab(tabName) {
            document.getElementById('tab-catalog').style.display = tabName === 'catalog' ? 'block' : 'none';
            document.getElementById('tab-orders').style.display = tabName === 'orders' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (tabName === 'catalog' && idx === 0) || (tabName === 'orders' && idx === 1));
            });
            if (tabName === 'orders') {
                renderOrdersList('orders-list');
                checkOrdersStatus();
            }
        }

        async function submitOrder() {
            const contact = document.getElementById('cust-contact').value || 'Не указан';
            const price = document.getElementById('order-price').value || 50000;
            const orderId = Date.now().toString().slice(-6);

            const orderData = {
                id: orderId,
                total: price,
                contact: contact,
                items: ['3D Печать / Модель']
            };

            // 1. Сохраняем локально на устройстве клиента
            saveNewOrder(orderData);

            // 2. Отправляем уведомление серверу для Telegram Bot
            try {
                const res = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                if (res.ok) {
                    alert('Заказ №' + orderId + ' успешно отправлен!');
                    showTab('orders');
                } else {
                    alert('Заказ сохранён локально, но произошла ошибка отправки серверу.');
                }
            } catch (err) {
                alert('Заказ сохранён локально!');
                showTab('orders');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderOrdersList('orders-list');
        });
    </script>
</body>
</html>
